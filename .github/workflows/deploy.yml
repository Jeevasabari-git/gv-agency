name: gv agency
on:
  pull_request: 
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Latest Code
        run: |
          cd /home/ubuntu/github-action-ci-cd
          git pull origin master

      - name: Deploy static site
        run: |
          # Example: copy files to your web server directory (e.g. nginx)
          sudo cp -r /home/ubuntu/github-action-ci-cd/* /var/www/html/
